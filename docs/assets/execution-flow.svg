<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">Arbiter execution flow</title><desc id="desc">Five steps from capability request to normalized paid result.</desc>
  <style>.bg{fill:#f4f1e8}.line{stroke:#b9b8ad;stroke-width:2}.dot{fill:#11130f}.n{fill:#c8ff3d;font:700 13px Arial}.h{fill:#11130f;font:700 16px Arial}.p{fill:#66695f;font:13px Arial}</style>
  <rect class="bg" width="1120" height="240" rx="18"/><path class="line" d="M90 70h940"/>
  <g transform="translate(90)"><circle class="dot" cx="0" cy="70" r="25"/><text class="n" x="-8" y="75">01</text><text class="h" x="-45" y="125">Challenge</text><text class="p" x="-65" y="150">fetch live 402s</text></g>
  <g transform="translate(325)"><circle class="dot" cx="0" cy="70" r="25"/><text class="n" x="-8" y="75">02</text><text class="h" x="-32" y="125">Filter</text><text class="p" x="-68" y="150">validate constraints</text></g>
  <g transform="translate(560)"><circle class="dot" cx="0" cy="70" r="25"/><text class="n" x="-8" y="75">03</text><text class="h" x="-28" y="125">Route</text><text class="p" x="-69" y="150">minimize economics</text></g>
  <g transform="translate(795)"><circle class="dot" cx="0" cy="70" r="25"/><text class="n" x="-8" y="75">04</text><text class="h" x="-26" y="125">Pay</text><text class="p" x="-66" y="150">authorize onchain</text></g>
  <g transform="translate(1030)"><circle class="dot" cx="0" cy="70" r="25"/><text class="n" x="-8" y="75">05</text><text class="h" x="-38" y="125">Return</text><text class="p" x="-75" y="150">normalize + receipt</text></g>
</svg>
