name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SDK typecheck
        run: pnpm --filter ecorouter typecheck
      - name: SDK tests
        run: pnpm --filter ecorouter test
      - name: Kit 12 agent tests
        run: pnpm --filter @ecorouter/kit12 typecheck && pnpm --filter @ecorouter/kit12 test
      - name: Landing page builds
        run: pnpm --filter @ecorouter/site exec astro build --outDir "$RUNNER_TEMP/site"
