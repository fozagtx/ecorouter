<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">EcoRouter architecture</title>
  <desc id="desc">A developer agent calls the local TypeScript SDK, which routes x402 capabilities under strict mandate caps.</desc>
  <style>
    .bg { fill: #0c0c09; }
    .box { fill: #161611; stroke: rgba(255, 255, 255, 0.1); stroke-width: 1.5; }
    .box-active { fill: #1d1d16; stroke: #d25611; stroke-width: 2; }
    .accent { fill: #d25611; }
    .h { fill: #fbfbf9; font: 700 19px 'IBM Plex Mono', monospace, -apple-system, sans-serif; }
    .p { fill: #abab9c; font: 14px 'IBM Plex Mono', monospace, -apple-system, sans-serif; }
    .arrow { stroke: #d25611; stroke-width: 2.5; fill: none; stroke-dasharray: 4 2; }
    .badge { fill: #d25611; }
    .small { fill: #ffffff; font: 700 11px 'IBM Plex Mono', monospace; letter-spacing: 1px; }
  </style>
  <rect class="bg" width="1120" height="390" rx="16"/>
  
  <!-- Developer Agent -->
  <rect class="box" x="40" y="100" width="210" height="170" rx="10"/>
  <text class="h" x="65" y="145">Autonomous Agent</text>
  <text class="p" x="65" y="180">requests web.crawl</text>
  <text class="p" x="65" y="206">or code.sandbox</text>
  <text class="p" x="65" y="232">signs ed25519 mandate</text>
  
  <!-- Arrow 1 -->
  <path class="arrow" d="M250 185h65"/>
  <polygon class="accent" points="315,180 325,185 315,190"/>
  
  <!-- EcoRouter Engine -->
  <rect class="box-active" x="325" y="65" width="250" height="240" rx="10"/>
  <text class="h" x="350" y="110">EcoRouter Engine</text>
  <text class="p" x="350" y="145">HTTP 402 negotiation</text>
  <text class="p" x="350" y="172">per-hop budget check</text>
  <text class="p" x="350" y="199">latency &amp; SLA arbitrage</text>
  <text class="p" x="350" y="226">atomic micro-settle</text>
  <rect class="badge" x="350" y="250" width="180" height="26" rx="13"/>
  <text class="small" x="368" y="267">TYPESCRIPT · LOCAL SDK</text>
  
  <!-- Arrow 2 -->
  <path class="arrow" d="M575 185h65"/>
  <polygon class="accent" points="640,180 650,185 640,190"/>
  
  <!-- Smart Mandate Account -->
  <rect class="box" x="650" y="65" width="220" height="240" rx="10"/>
  <text class="h" x="675" y="110">Mandate Account</text>
  <text class="p" x="675" y="145">global lifetime cap</text>
  <text class="p" x="675" y="172">per-call limit ($0.01)</text>
  <text class="p" x="675" y="199">expiry &amp; revocation</text>
  <text class="p" x="675" y="226">verifiable receipt</text>
  <rect class="badge" x="675" y="250" width="150" height="26" rx="13"/>
  <text class="small" x="693" y="267">ON-CHAIN · MANDATE</text>
  
  <!-- Arrow 3 -->
  <path class="arrow" d="M870 185h65"/>
  <polygon class="accent" points="935,180 945,185 935,190"/>
  
  <!-- Providers -->
  <rect class="box" x="945" y="100" width="135" height="170" rx="10"/>
  <text class="h" x="965" y="145">Provider</text>
  <text class="p" x="965" y="180">x402 Node</text>
  <text class="p" x="965" y="206">200 OK</text>
  <text class="p" x="965" y="232">USDC micro</text>
</svg>
