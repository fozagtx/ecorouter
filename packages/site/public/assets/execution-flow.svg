<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">EcoRouter execution flow</title>
  <desc id="desc">Five steps from capability request to normalized paid result.</desc>
  <style>
    .bg { fill: #0c0c09; }
    .line { stroke: rgba(255, 255, 255, 0.1); stroke-width: 2; }
    .dot { fill: #161611; stroke: #d25611; stroke-width: 2; }
    .n { fill: #d25611; font: 700 13px 'IBM Plex Mono', monospace; }
    .h { fill: #fbfbf9; font: 700 16px 'IBM Plex Mono', monospace, -apple-system, sans-serif; }
    .p { fill: #abab9c; font: 13px 'IBM Plex Mono', monospace, -apple-system, sans-serif; }
  </style>
  <rect class="bg" width="1120" height="240" rx="16"/>
  <path class="line" d="M90 70h940"/>
  
  <g transform="translate(90)">
    <circle class="dot" cx="0" cy="70" r="24"/>
    <text class="n" x="-8" y="75">01</text>
    <text class="h" x="-45" y="125">Probe 402</text>
    <text class="p" x="-65" y="150">fetch live terms</text>
  </g>
  
  <g transform="translate(325)">
    <circle class="dot" cx="0" cy="70" r="24"/>
    <text class="n" x="-8" y="75">02</text>
    <text class="h" x="-32" y="125">Validate</text>
    <text class="p" x="-68" y="150">mandate limits</text>
  </g>
  
  <g transform="translate(560)">
    <circle class="dot" cx="0" cy="70" r="24"/>
    <text class="n" x="-8" y="75">03</text>
    <text class="h" x="-28" y="125">Arbitrage</text>
    <text class="p" x="-69" y="150">latency + cost</text>
  </g>
  
  <g transform="translate(795)">
    <circle class="dot" cx="0" cy="70" r="24"/>
    <text class="n" x="-8" y="75">04</text>
    <text class="h" x="-26" y="125">Settle</text>
    <text class="p" x="-66" y="150">atomic x402</text>
  </g>
  
  <g transform="translate(1030)">
    <circle class="dot" cx="0" cy="70" r="24"/>
    <text class="n" x="-8" y="75">05</text>
    <text class="h" x="-38" y="125">Deliver</text>
    <text class="p" x="-75" y="150">receipt + data</text>
  </g>
</svg>
