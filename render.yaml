services:
  - type: web
    name: ecorouter-site
    runtime: static
    buildCommand: npm install -g pnpm@10 && pnpm install && pnpm build:site
    staticPublishPath: ./docs
    pullRequestPreviewsEnabled: true
    domains:
      - ecorouter.xyz
      - www.ecorouter.xyz
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SITE_URL
        value: https://ecorouter.xyz
      - key: BASE_PATH
        value: /
