services:
  - type: web
    name: ecorouter-gateway
    runtime: node
    plan: starter
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm --filter @ecorouter/gateway build
    startCommand: pnpm --filter @ecorouter/gateway start
    envVars:
      - { key: NODE_VERSION, value: 22 }
      - { key: DATABASE_URL, fromDatabase: { name: ecorouter-gateway-db, property: connectionString } }
      - { key: NEBIUS_API_KEY, sync: false }
      - { key: PUBLIC_URL, fromService: { type: web, name: ecorouter-gateway, property: host } }
  - type: web
    name: ecorouter-site
    runtime: static
    buildCommand: npm install -g pnpm@10 && pnpm install && pnpm build:site
    staticPublishPath: ./docs
    pullRequestPreviewsEnabled: true
    domains:
      - ecorouter.xyz
      - www.ecorouter.xyz
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SITE_URL
        value: https://ecorouter.xyz
      - key: BASE_PATH
        value: /
      - key: VITE_GATEWAY_URL
        fromService:
          type: web
          name: ecorouter-gateway
          property: host
  - type: worker
    name: ecorouter-agent
    runtime: node
    plan: starter
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm --filter ecorouter build
    startCommand: node packages/sdk/dist/worker.js
    envVars:
      - { key: NODE_VERSION, value: 22 }
      - { key: AGENT_SECRET, sync: false }
      - { key: AGENT_SERVICE, value: search }
      - { key: AGENT_AMOUNT, value: "0.25" }
      - { key: AGENT_EVERY, value: day }
databases:
  - name: ecorouter-gateway-db
    plan: basic-256mb
    databaseName: ecorouter_gateway
    user: ecorouter_gateway
